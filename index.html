<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06301C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Ojàmi — Your Personal Market Shopper in Ibadan</title>
    <meta
      name="description"
      content="Ojàmi sends a trusted personal shopper to Bodija, Oje, Aleshinloye and every major Ibadan market for you. Send your list, we buy at market price, and deliver to your door or office the same day."
    />
    <link rel="canonical" href="https://ojami.ng/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ojàmi" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://ojami.ng/" />
    <meta property="og:title" content="Ojàmi — Your Personal Market Shopper in Ibadan" />
    <meta
      property="og:description"
      content="Skip the market stress. Send your list, a verified Ojàmi shopper buys at real market price and delivers to your door or office the same day."
    />
    <!--
      TODO before launch: replace with a self-hosted 1200×630 card at /og.jpg.
      This is currently a hotlinked stock photo, which means the brand's share
      card depends on a third party and isn't actually a picture of the business.
    -->
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1585540083814-ea6ee8af9e4f?w=1200&h=630&fit=crop&q=80"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A market trader's produce stall in Ibadan" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ojàmi — Your Personal Market Shopper in Ibadan" />
    <meta
      name="twitter:description"
      content="Send your market list. A verified shopper buys at real market price in Ibadan and delivers the same day."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1585540083814-ea6ee8af9e4f?w=1200&h=630&fit=crop&q=80"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!--
      Both faces are variable fonts, so a weight *range* ships one file per family
      instead of the five static instances this used to request. Loaded off the
      critical path via the print-media swap: a render-blocking stylesheet from a
      third-party host is the last thing this audience's connection needs, and
      `display=swap` means text paints in the fallback immediately either way.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      />
    </noscript>

    <!--
      One city, one service, a phone number and opening hours: exactly the shape
      Google wants for a local business panel. Keep in step with src/data/brand.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://ojami.ng/#business",
        "name": "Ojàmi",
        "alternateName": "Ojami",
        "description": "Personal market shopping and same-day grocery delivery across Ibadan, Nigeria. A verified human shopper buys your list at real market price and delivers to your door or office.",
        "url": "https://ojami.ng/",
        "telephone": "+2348000000000",
        "email": "hello@ojami.ng",
        "priceRange": "₦₦",
        "currenciesAccepted": "NGN",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Bodija",
          "addressLocality": "Ibadan",
          "addressRegion": "Oyo State",
          "addressCountry": "NG"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "06:00",
            "closes": "20:00"
          }
        ],
        "areaServed": [
          { "@type": "City", "name": "Ibadan" },
          { "@type": "Place", "name": "Bodija" },
          { "@type": "Place", "name": "UI / Agbowo" },
          { "@type": "Place", "name": "Jericho" },
          { "@type": "Place", "name": "Dugbe" },
          { "@type": "Place", "name": "Ring Road" },
          { "@type": "Place", "name": "Challenge" },
          { "@type": "Place", "name": "Oluyole" },
          { "@type": "Place", "name": "Akobo" },
          { "@type": "Place", "name": "Iwo Road" },
          { "@type": "Place", "name": "Apata" },
          { "@type": "Place", "name": "Moniya" }
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Quick Run",
            "description": "A short list from one market, up to 12 items.",
            "price": "1500",
            "priceCurrency": "NGN"
          },
          {
            "@type": "Offer",
            "name": "Full Basket",
            "description": "The full monthly market run across up to three markets.",
            "price": "2500",
            "priceCurrency": "NGN"
          },
          {
            "@type": "Offer",
            "name": "Office Plan",
            "description": "Eight runs a month for teams and households, one monthly invoice.",
            "price": "14000",
            "priceCurrency": "NGN"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
